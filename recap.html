<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Stream Recap | Swerve256</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/swerve.css">
</head>
<body class="recap-body">
  <main class="recap-screen">
    <div class="recap-topline"><span>SWERVE256</span><span>STREAM RECAP</span></div>
    <section class="recap-hero">
      <p class="eyebrow">THANKS FOR HANGING OUT</p>
      <h1 id="latestTitle">LATEST STREAM</h1>
      <p id="recapDate" class="recap-date">Validated stream summary</p>
    </section>
    <section class="recap-metrics">
      <div class="recap-metric"><strong id="latestMessages">—</strong><span>MESSAGES</span></div>
      <div class="recap-metric"><strong id="latestChatters">—</strong><span>CHATTERS</span></div>
      <div class="recap-metric"><strong id="recapDuration">—</strong><span>STREAM TIME</span></div>
      <div class="recap-metric"><strong id="validatedStreams">—</strong><span>VALIDATED STREAMS</span></div>
    </section>
    <section class="recap-columns">
      <div class="recap-panel"><p class="eyebrow">STREAK LEADERS</p><div id="streakLeaderboard" class="leaderboard"></div></div>
      <div class="recap-panel"><p class="eyebrow">TONIGHT</p><div id="latestRecap" class="leaderboard"></div></div>
    </section>
    <div class="recap-footer"><strong>LET IT RIDE.</strong><span>SWERVE256</span></div>
  </main>
  <script src="js/recap.js"></script>
</body>
</html>
